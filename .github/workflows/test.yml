name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: agent-tool-loop
        run: python -m unittest discover -s tests -t . -v
        working-directory: agent-tool-loop
      - name: local-retrieval
        run: python -m unittest discover -s tests -t . -v
        working-directory: local-retrieval
      - name: prompt-eval
        run: python -m unittest discover -s tests -t . -v
        working-directory: prompt-eval
